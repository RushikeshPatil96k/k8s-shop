server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Lets the page show which frontend pod served you (nice for the HPA demo)
  add_header X-Frontend-Pod $hostname always;

  # Anything starting with /api goes to the backend Service inside the cluster
  location /api/ {
    proxy_pass http://backend-service:5000;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}