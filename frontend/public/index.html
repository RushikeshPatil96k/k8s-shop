<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sprout &amp; Stone – houseplants that fit your life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <a class="brand" href="#">Sprout &amp; Stone</a>
    <button class="cart-btn" id="openCart" aria-label="Open cart">Cart <span id="cartCount">0</span></button>
  </header>

  <main>
    <section class="hero">
      <h1>Plants that survive your schedule.</h1>
      <p>Eight hardy houseplants, shipped in recycled pots. Pick one, forget to water it for a week, and watch it carry on.</p>
    </section>

    <section class="shop">
      <div class="filters" id="filters" role="tablist" aria-label="Filter plants"></div>
      <div class="grid" id="grid"><p class="muted">Loading plants…</p></div>
    </section>
  </main>

  <footer class="cluster">
    <strong>Live from the cluster</strong>
    <span>Frontend pod: <code id="fePod">–</code></span>
    <span>Backend pod: <code id="bePod">–</code></span>
    <span>Orders placed: <code id="orders">–</code></span>
  </footer>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>Your cart</h2>
      <button id="closeCart" aria-label="Close cart">Close</button>
    </div>
    <div id="cartItems"></div>
    <form id="checkout">
      <p class="total">Total <span id="cartTotal">₹0</span></p>
      <label>Name <input name="name" required autocomplete="name" /></label>
      <label>Email <input name="email" type="email" required autocomplete="email" /></label>
      <button class="primary" type="submit">Place order</button>
      <p id="msg" role="status"></p>
    </form>
  </aside>
  <div class="scrim" id="scrim"></div>

  <script src="app.js"></script>
</body>
</html>
